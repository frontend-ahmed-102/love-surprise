<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>مستعدة؟ 🤎</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root{
      --ink: #0e0a17;
      --plum: #241732;
      --wine: #63273f;
      --gold: #d4a857;
      --gold-light: #f0d9a3;
      --cream: #f5ecdd;
      --lavender: #b9a7c9;
    }

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      min-height: 100vh;
      background: var(--ink);
      color: var(--cream);
      font-family: "Tajawal", sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /* النجوم */

    .stars{
      position: fixed;
      inset: 0;

      pointer-events: none;

      background-image:
        radial-gradient(2px 2px at 20% 30%, var(--gold-light), transparent),
        radial-gradient(2px 2px at 70% 15%, var(--cream), transparent),
        radial-gradient(2px 2px at 85% 60%, var(--gold-light), transparent),
        radial-gradient(2px 2px at 10% 75%, var(--cream), transparent),
        radial-gradient(2px 2px at 45% 85%, var(--gold-light), transparent);

      animation: stars 3s infinite alternate;
    }

    @keyframes stars{

      from{
        opacity: .3;
      }

      to{
        opacity: .9;
      }

    }


    .countdown-box{
      position: relative;
      z-index: 2;

      text-align: center;

      width: min(90%, 500px);

      padding: 50px 25px;

      background: rgba(36, 23, 50, .6);

      border: 1px solid rgba(212, 168, 87, .3);

      border-radius: 25px;

      backdrop-filter: blur(10px);

      box-shadow:
        0 0 50px rgba(212, 168, 87, .1);
    }


    h1{
      font-family: "Amiri", serif;

      font-size: 2.5rem;

      color: var(--gold-light);

      margin-bottom: 15px;
    }


    .text{
      color: var(--lavender);

      line-height: 1.9;

      margin-bottom: 35px;
    }


    /* الدائرة */

    .timer{
      position: relative;

      width: 220px;
      height: 220px;

      margin: auto;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        conic-gradient(
          var(--gold) 360deg,
          rgba(255,255,255,.08) 0deg
        );
    }


    .timer::before{

      content: "";

      position: absolute;

      width: 190px;
      height: 190px;

      background: var(--ink);

      border-radius: 50%;
    }


    #time{

      position: relative;

      z-index: 2;

      font-size: 3.5rem;

      font-weight: bold;

      color: var(--cream);
    }


    .message{

      margin-top: 35px;

      color: var(--gold);

      opacity: .8;
    }


    .heart{

      position: absolute;

      bottom: -50px;

      color: var(--wine);

      animation: float 5s linear infinite;

      opacity: .6;
    }


    @keyframes float{

      from{
        transform: translateY(0);
        opacity: 0;
      }

      20%{
        opacity: .7;
      }

      to{
        transform: translateY(-110vh);
        opacity: 0;
      }

    }


    .hide{
      animation: fadeOut 1s forwards;
    }


    @keyframes fadeOut{

      to{
        opacity: 0;
        transform: scale(1.1);
      }

    }

  </style>

</head>


<body>

  <div class="stars"></div>


  <div class="countdown-box" id="countdownBox">

    <h1>مستعدة يا كوكو؟🤎</h1>

    <p class="text">
      معاكي دقيقة واحدة بس...<br>
      وبعدها هتبدأ المفاجأة ✨
    </p>


    <div class="timer" id="timer">

      <span id="time">
        1:00
      </span>

    </div>


    <p class="message">
      خليكي مستعدة للمفاجأه يوزتي🤎
    </p>

  </div>


  <script>

    let timeLeft = 60;

    const time = document.getElementById("time");
    const timer = document.getElementById("timer");
    const box = document.getElementById("countdownBox");


    const countdown = setInterval(() => {

      timeLeft--;


      const minutes = Math.floor(timeLeft / 60);

      const seconds = timeLeft % 60;


      time.textContent =
        `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;


      const progress =
        (timeLeft / 60) * 360;


      timer.style.background =
        `conic-gradient(
          var(--gold) ${progress}deg,
          rgba(255,255,255,.08) ${progress}deg
        )`;


      if(timeLeft <= 0){

        clearInterval(countdown);


        time.textContent = "🤎";


        setTimeout(() => {

          box.classList.add("hide");

        }, 500);


        setTimeout(() => {

          window.location.href = "index.html";

        }, 1500);

      }


    }, 1000);


    /* قلوب متحركة */

    setInterval(() => {

      const heart =
        document.createElement("span");

      heart.classList.add("heart");

      heart.innerHTML = "♥";

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.fontSize =
        10 + Math.random() * 20 + "px";


      document.body.appendChild(heart);


      setTimeout(() => {

        heart.remove();

      }, 5000);


    }, 700);

  </script>

</body>

</html>
